name: TokenRemain

options:
  bundleIdPrefix: com.jamesli
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.6"
    CURRENT_PROJECT_VERSION: "8"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Automatic development signing is required for device builds so the
    # CloudKit, App Group, push, and Keychain entitlements are authorized by
    # Apple-issued provisioning profiles. Simulator builds continue to work.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: "84397AQ22Y"

packages:
  TokenRemainKit:
    path: Packages/TokenRemainKit

targets:
  # ---------------------------------------------------------------- iOS app
  TokenRemain:
    type: application
    platform: iOS
    sources:
      - path: App
      # Compiled into the app too (not just the extension) so the screenshot-only
      # WidgetGalleryView renders the exact shipping widget views for capture.
      - path: Widgets/TRWidgetViews.swift
    dependencies:
      - package: TokenRemainKit
      # The resource-free cross-device protocol product. CloudKit integration
      # remains in the main app target; widgets and watch targets never import it.
      - package: TokenRemainKit
        product: TokenRemainSyncKit
      - sdk: WidgetKit.framework
      - target: TokenRemainWidgets
        embed: true
      - target: TokenRemainWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesli.tokenremain
        PRODUCT_NAME: TokenRemain
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TOKENREMAIN_BROADCAST_BASE_URL: https://api.tokenremain.com
        CODE_SIGN_ENTITLEMENTS: SupportFiles/TokenRemain.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
          ICLOUD_CONTAINER_ENVIRONMENT: Development
        Release:
          APS_ENVIRONMENT: production
          ICLOUD_CONTAINER_ENVIRONMENT: Production
    info:
      path: SupportFiles/TokenRemain-Info.plist
      properties:
        CFBundleDisplayName: TokenRemain
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, es, de, ja, ko]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        # CloudKit zone subscriptions use content-available pushes only; no
        # quota data is ever carried in an APNs payload.
        UIBackgroundModes: [remote-notification]
        TokenRemainBroadcastBaseURL: $(TOKENREMAIN_BROADCAST_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.jamesli.tokenremain
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [tokenremain]

  # -------------------------------------------------- iOS widget extension
  TokenRemainWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - package: TokenRemainKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesli.tokenremain.widgets
        PRODUCT_NAME: TokenRemainWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SupportFiles/TokenRemainWidgets.entitlements
    info:
      path: SupportFiles/TokenRemainWidgets-Info.plist
      properties:
        CFBundleDisplayName: TokenRemain
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ------------------------------------------------------------ watchOS app
  TokenRemainWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    dependencies:
      - package: TokenRemainKit
      - target: TokenRemainWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesli.tokenremain.watchkitapp
        # Keep the bundle product path distinct from the containing iOS app;
        # CFBundleDisplayName below remains the user-facing "TokenRemain".
        PRODUCT_NAME: TokenRemainWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.jamesli.tokenremain
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        CODE_SIGN_ENTITLEMENTS: SupportFiles/TokenRemainWatch.entitlements
    info:
      path: SupportFiles/TokenRemainWatch-Info.plist
      properties:
        CFBundleDisplayName: TokenRemain
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jamesli.tokenremain

  # ------------------------------------------ watchOS widget extension
  TokenRemainWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
    dependencies:
      - package: TokenRemainKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesli.tokenremain.watchkitapp.widgets
        PRODUCT_NAME: TokenRemainWatchWidgets
        CODE_SIGN_ENTITLEMENTS: SupportFiles/TokenRemainWatchWidgets.entitlements
    info:
      path: SupportFiles/TokenRemainWatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: TokenRemain
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # --------------------------------------------------------------- UI tests
  TokenRemainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TokenRemain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesli.tokenremain.uitests
        TEST_TARGET_NAME: TokenRemain

  TokenRemainAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: TokenRemain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesli.tokenremain.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TokenRemain.app/TokenRemain"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TokenRemain:
    build:
      targets:
        TokenRemain: all
        TokenRemainWidgets: all
        TokenRemainWatch: all
        TokenRemainWatchWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TokenRemainAppTests
        - TokenRemainUITests

  # Lets the watch app and its complications be built against the watchOS SDK
  # on their own, independently of the iPhone app that embeds them.
  TokenRemainWatch:
    build:
      targets:
        TokenRemainWatch: all
        TokenRemainWatchWidgets: all
    run:
      config: Debug

  TokenRemainUITests:
    build:
      targets:
        TokenRemain: all
        TokenRemainUITests: [test]
    test:
      config: Debug
      targets:
        - TokenRemainUITests

  TokenRemainKit:
    build:
      targets:
        TokenRemain: [test]
    test:
      config: Debug
      targets:
        - package: TokenRemainKit/TokenRemainKitTests
